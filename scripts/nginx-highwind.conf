# Include inside the existing HTTPS server block. Only versioned model assets
# reach the loopback exporter; original model/audio retain their static route.
location ^~ /chalons/data/highwind/ {
    root C:/nginx/html;
    try_files $uri =404;
    gzip_static on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
    location ~ ^/chalons/data/highwind/v[1-9][0-9]*/ {
        rewrite ^/chalons/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5195;
        proxy_read_timeout 210s;
        proxy_intercept_errors off;
    }
}
