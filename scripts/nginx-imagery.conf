# Include these locations inside the existing Nginx server block.
# Run `npm run dev` in the same project on the host to acquire and retain
# new images. All originals remain in dist/data/imagery/ign/; keep that
# directory across releases. Nginx can serve the preloaded files statically
# without this configuration when no new sectors need to be acquired.

location /data/imagery/ign/ {
    proxy_pass http://127.0.0.1:5173/data/imagery/ign/;
    proxy_read_timeout 75s;
}

location /chalons/data/imagery/ign/ {
    proxy_pass http://127.0.0.1:5173/data/imagery/ign/;
    proxy_read_timeout 75s;
}
