# Include inside the existing HTTPS server block, alongside chalons.conf.
# Serve saved originals even when the acquisition service is stopped.
location = /chalons/imagery-config.json {
    alias C:/Users/cid77/Documents/ChatGPT/map/imagery-config.json;
    default_type application/json;
    gzip_static off;
    add_header Cache-Control "no-store" always;
    limit_except GET { deny all; }
}
location ^~ /chalons/data/imagery/ign/packs/ {
    alias C:/Users/cid77/Documents/ChatGPT/map/dist/data/imagery/ign/packs/;
    default_type application/octet-stream;
    gzip_static off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @chalons_ign_acquire;
    limit_except GET { deny all; }
}
location ^~ /chalons/data/imagery/ign/ {
    alias C:/Users/cid77/Documents/ChatGPT/map/dist/data/imagery/ign/;
    default_type image/jpeg;
    gzip_static off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @chalons_ign_acquire;
    limit_except GET { deny all; }
}

# Only a cache miss contacts Node. It saves the image before returning it.
location @chalons_ign_acquire {
    rewrite ^/chalons/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5174;
    proxy_read_timeout 75s;
    proxy_intercept_errors off;
}
